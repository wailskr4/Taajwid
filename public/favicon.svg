<svg id="tajweedLogo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" class="w-full h-auto logo-preview-svg" style="background: transparent;">
                        <defs>
                            <!-- Color Gradients - Sensory Friendly Warm & Calm Colors -->
                            <linearGradient id="skyCalmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#38bdf8"></stop> <!-- Calm Sky Blue -->
                                <stop offset="100%" stop-color="#0284c7"></stop>
                            </linearGradient>

                            <linearGradient id="tealSoftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#2dd4bf"></stop> <!-- Soft Mint / Teal -->
                                <stop offset="100%" stop-color="#0d9488"></stop>
                            </linearGradient>

                            <linearGradient id="amberWarmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#fcd34d"></stop> <!-- Warm Soft Amber Gold -->
                                <stop offset="100%" stop-color="#f59e0b"></stop>
                            </linearGradient>

                            <linearGradient id="bookPageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffffff"></stop>
                                <stop offset="100%" stop-color="#f0f9ff"></stop>
                            </linearGradient>

                            <!-- Soft Glow Filter -->
                            <filter id="gentleGlow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
                                <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
                            </filter>
                        </defs>

                        <!-- LOGO EMBLEM / ICON (Center Left) -->
                        <g id="logoIcon" transform="translate(620, 190)">
                            
                            <!-- Soft Background Halo / Aura Circle -->
                            <circle cx="0" cy="-10" r="125" fill="#e0f2fe" opacity="0.6"></circle>
                            <circle cx="0" cy="-10" r="105" fill="#ccfbf1" opacity="0.5"></circle>

                            <!-- Friendly Soft Crescent Curve -->
                            <path d="M -20 -115 A 100 100 0 1 0 100 10 A 85 85 0 1 1 -20 -115 Z" fill="url(#amberWarmGrad)" opacity="0.9"></path>

                            <!-- Open Quran Book Pages - Rounded Friendly Geometric Lines -->
                            <g id="openQuranBook">
                                <!-- Left Page Base Shadow -->
                                <path d="M 0 35 C -40 10, -85 20, -100 40 L -100 -25 C -85 -45, -40 -35, 0 -15 Z" fill="#bae6fd"></path>
                                <!-- Right Page Base Shadow -->
                                <path d="M 0 35 C 40 10, 85 20, 100 40 L 100 -25 C 85 -45, 40 -35, 0 -15 Z" fill="#99f6e4"></path>

                                <!-- Main Left Page -->
                                <path d="M -3 30 C -40 5, -80 15, -95 32 L -95 -30 C -80 -48, -40 -38, -3 -20 Z" fill="url(#bookPageGrad)" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"></path>
                                <!-- Main Right Page -->
                                <path d="M 3 30 C 40 5, 80 15, 95 32 L 95 -30 C 80 -48, 40 -38, 3 -20 Z" fill="url(#bookPageGrad)" stroke="#2dd4bf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"></path>

                                <!-- Gentle Book Bookmark Ribbons (Rounded Puzzle/Heart feel) -->
                                <path d="M -8 28 Q -15 65 0 85 Q 12 65 5 28 Z" fill="url(#amberWarmGrad)"></path>
                                
                                <!-- Soft Quran Lines / Ayah Representation (Calm Dots & Rounded Strokes) -->
                                <line x1="-75" y1="-12" x2="-25" y2="-22" stroke="#93c5fd" stroke-width="5" stroke-linecap="round"></line>
                                <line x1="-70" y1="5" x2="-30" y2="-5" stroke="#93c5fd" stroke-width="5" stroke-linecap="round"></line>

                                <line x1="25" y1="-22" x2="75" y2="-12" stroke="#5eead4" stroke-width="5" stroke-linecap="round"></line>
                                <line x1="30" y1="-5" x2="70" y2="5" stroke="#5eead4" stroke-width="5" stroke-linecap="round"></line>
                            </g>

                            <!-- Gentle Glowing Stars / Rays above Quran (Friendly Sensory Elements) -->
                            <!-- Central Warm Star -->
                            <path d="M 0 -75 L 4 -62 L 17 -62 L 7 -54 L 11 -42 L 0 -50 L -11 -42 L -7 -54 L -17 -62 L -4 -62 Z" fill="#f59e0b" filter="url(#gentleGlow)"></path>
                            
                            <!-- Small Accent Bubbles/Sparkles -->
                            <circle cx="-65" cy="-70" r="7" fill="#38bdf8"></circle>
                            <circle cx="70" cy="-65" r="8" fill="#2dd4bf"></circle>
                            <circle cx="-100" cy="-10" r="5" fill="#fcd34d"></circle>
                            <circle cx="100" cy="0" r="6" fill="#38bdf8"></circle>

                            <!-- Integrated Puzzle Soft Piece Accent (Autism Symbolism Subtly Integrated) -->
                            <path d="M -30 -90 C -25 -100, -10 -100, -5 -90 C 5 -100, 20 -95, 15 -85 C 25 -75, 10 -65, 0 -70 C -15 -65, -25 -75, -30 -90 Z" fill="#2dd4bf" opacity="0.3"></path>
                        </g>

                        <!-- MAIN TYPOGRAPHY "تجويد" -->
                        <g id="mainText" transform="translate(100, 165)">
                            
                            <!-- Soft Shadow Layer for Text Depth without Harsh Contrast -->
                            <text x="320" y="20" font-family="'Cairo', 'Tajawal', sans-serif" font-size="115" font-weight="800" fill="#0284c7" opacity="0.15" text-anchor="middle">تـجـويــد</text>

                            <!-- Main Word Sculpture -->
                            <text x="320" y="10" font-family="'Cairo', 'Tajawal', sans-serif" font-size="115" font-weight="800" fill="url(#skyCalmGrad)" text-anchor="middle" letter-spacing="1">
                                تـجـويــد
                            </text>

                            <!-- Friendly Rounded Dots on Arabic Letters (Decorative Circles) -->
                            <!-- Ta (ت) dots -->
                            <circle cx="475" cy="-80" r="10" fill="#f59e0b"></circle>
                            <circle cx="450" cy="-80" r="10" fill="#f59e0b"></circle>

                            <!-- Jeem (ج) dot -->
                            <circle cx="360" cy="45" r="11" fill="#0d9488"></circle>

                            <!-- Ya (ي) dots -->
                            <circle cx="215" cy="45" r="10" fill="#38bdf8"></circle>
                            <circle cx="190" cy="45" r="10" fill="#38bdf8"></circle>
                        </g>

                        <!-- TAGLINE "تعلّم قراءة القرآن الكريم" -->
                        <g id="taglineText" transform="translate(100, 260)">
                            <!-- Pill Shape Background Container for High Legibility -->
                            <rect x="25" y="-32" width="590" height="52" rx="26" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="2.5"></rect>
                            
                            <!-- Tagline Text -->
                            <text x="320" y="3" font-family="'Cairo', sans-serif" font-size="28" font-weight="700" fill="#0f766e" text-anchor="middle" letter-spacing="0.5">
                                تعلّم قراءة القرآن الكريم
                            </text>

                            <!-- Decorative Side Hearts/Sparkles in Tagline -->
                            <circle cx="55" cy="2" r="6" fill="#f59e0b"></circle>
                            <circle cx="585" cy="2" r="6" fill="#38bdf8"></circle>
                        </g>
                    </svg>